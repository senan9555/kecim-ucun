
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş sayı</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
    }

    .box {
      text-align: center;
    }

    .label {
      font-size: 20px;
      margin-bottom: 15px;
    }

    #count {
      font-size: 64px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      color: #777;
      font-size: 13px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="label">Giriş sayı</div>
    <div id="count">...</div>
    <div id="status"></div>
    <button onclick="loadCount()">Yenilə</button>
  </main>

  <script>
    async function loadCount() {
      const count = document.getElementById("count");
      const status = document.getElementById("status");

      count.textContent = "...";
      status.textContent = "";

      try {
        const response = await fetch(
          "https://countapi.mileshilliard.com/api/v1/get/kecim_ucun_visits_2026_8x4m7q2p",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Sayğac cavab vermədi");
        }

        const data = await response.json();
        count.textContent = data.value ?? "0";
      } catch (error) {
        count.textContent = "—";
        status.textContent = "Say yüklənmədi. Yenidən yoxla.";
      }
    }

    loadCount();
  </script>
</body>
</html>
